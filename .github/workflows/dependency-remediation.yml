name: Temporary Dependency Remediation

on:
  push:
    branches: [full-production-audit-hardening]
    paths:
      - ".github/workflows/dependency-remediation.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: full-production-audit-hardening
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reduce dependency surface
        run: |
          node <<'NODE'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.scripts.lint = "tsc --noEmit";
          pkg.dependencies = {
            next: "15.5.24",
            react: "19",
            "react-dom": "19"
          };
          pkg.devDependencies = {
            "@tailwindcss/postcss": "latest",
            "@types/node": "latest",
            "@types/react": "latest",
            "@types/react-dom": "latest",
            postcss: "latest",
            tailwindcss: "latest",
            typescript: "latest"
          };
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          NODE

      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Pin resolved direct versions
        run: |
          pnpm add next@15.5.24 react@19 react-dom@19 --save-exact
          pnpm add -D @tailwindcss/postcss@latest @types/node@latest @types/react@latest @types/react-dom@latest postcss@latest tailwindcss@latest typescript@latest --save-exact

      - name: Security audit
        run: pnpm audit --audit-level high

      - name: Typecheck and build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_PI_SANDBOX: "true"
        run: |
          pnpm exec tsc --noEmit
          pnpm run build

      - name: Commit regenerated dependency graph
        run: |
          git config user.name "Qmoosa Pi Automation"
          git config user.email "actions@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "security: minimize and patch frontend dependencies [skip ci]"
            git push origin HEAD:full-production-audit-hardening
          fi
