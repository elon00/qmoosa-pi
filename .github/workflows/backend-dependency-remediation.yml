name: Temporary Backend Dependency Remediation

on:
  push:
    branches: [full-production-audit-hardening]
    paths:
      - ".github/workflows/backend-dependency-remediation.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: full-production-audit-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and patch backend dependencies
        working-directory: backend
        run: |
          npm ci
          npm audit fix

      - name: Verify security and tests
        working-directory: backend
        run: |
          npm audit --audit-level=high
          npm test
          npm run syntax

      - name: Commit patched backend lockfile
        run: |
          git config user.name "Qmoosa Pi Automation"
          git config user.email "actions@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "No backend dependency changes to commit."
          else
            git commit -m "security: patch backend dependency advisories [skip ci]"
            git push origin HEAD:full-production-audit-hardening
          fi
